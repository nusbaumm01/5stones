name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"
  # Pushes to main publish the apps to the "latest" GitHub Release.
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  release:
    name: Prepare release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create or move the "latest" release
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --prerelease --title "Latest build" \
            --notes "Built automatically from the newest commit on main. Download 5Stones for Mac or Windows below."

  build-macos:
    name: Build macOS
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build macos --release
      - name: Zip app
        run: cd build/macos/Build/Products/Release && ditto -c -k --keepParent 5Stones.app 5Stones-macos.zip
      - name: Publish to release
        if: env.PUBLISH == 'true'
        run: gh release upload latest build/macos/Build/Products/Release/5Stones-macos.zip --clobber

  build-windows:
    name: Build Windows
    needs: [test, release]
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Zip app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath 5Stones-windows.zip
      - name: Publish to release
        if: env.PUBLISH == 'true'
        shell: bash
        run: gh release upload latest 5Stones-windows.zip --clobber

  build-ios:
    name: Build iPhone (unsigned)
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Signing needs an Apple Developer account; this only checks that it builds.
      - run: flutter build ios --release --no-codesign
